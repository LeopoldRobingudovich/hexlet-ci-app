name: ci_training_actions
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: "npm"
      - run: npm install -g pnpm
      - run: make setup
      - run: make lint
      - run: make test
      - uses: hexlet-components/hello-from-hexlet-action@release

